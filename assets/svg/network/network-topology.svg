<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%" aria-label="Drishti Network Topology Architecture">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="red-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Marker Arrow -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "SF Mono", Consolas, "Courier New", monospace; }
    
    /* Animation pulses */
    @keyframes pulse-node {
      0%, 100% { r: 7px; opacity: 1; }
      50% { r: 10px; opacity: 0.6; }
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes radar-sweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .pulse-danger { animation: pulse-node 2s infinite ease-in-out; }
    .pulse-safe { animation: pulse-node 2.5s infinite ease-in-out; }
    .dash-line-cyan { stroke-dasharray: 6 6; animation: dash-flow 1.5s linear infinite; }
    .dash-line-red { stroke-dasharray: 6 6; animation: dash-flow 1.2s linear infinite; }
    .dash-line-emerald { stroke-dasharray: 6 6; animation: dash-flow 2s linear infinite; }
    .radar-beam { transform-origin: 820px 450px; animation: radar-sweep 6s linear infinite; }

    /* Accessibility / Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      .pulse-danger, .pulse-safe, .dash-line-cyan, .dash-line-red, .dash-line-emerald, .radar-beam {
        animation: none !important;
        stroke-dasharray: none !important;
      }
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1000" height="580" fill="url(#bg-grad)" rx="16" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#1e293b" stroke-width="0.7" opacity="0.4">
    <line x1="50" y1="0" x2="50" y2="580" /><line x1="150" y1="0" x2="150" y2="580" />
    <line x1="250" y1="0" x2="250" y2="580" /><line x1="350" y1="0" x2="350" y2="580" />
    <line x1="450" y1="0" x2="450" y2="580" /><line x1="550" y1="0" x2="550" y2="580" />
    <line x1="650" y1="0" x2="650" y2="580" /><line x1="750" y1="0" x2="750" y2="580" />
    <line x1="850" y1="0" x2="850" y2="580" /><line x1="950" y1="0" x2="950" y2="580" />
    <line x1="0" y1="60" x2="1000" y2="60" /><line x1="0" y1="160" x2="1000" y2="160" />
    <line x1="0" y1="260" x2="1000" y2="260" /><line x1="0" y1="360" x2="1000" y2="360" />
    <line x1="0" y1="460" x2="1000" y2="460" /><line x1="0" y1="540" x2="1000" y2="540" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(40, 42)">
    <rect x="-10" y="-20" width="940" height="44" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.2" />
    <circle cx="10" cy="2" r="5" fill="#10b981" />
    <text x="25" y="6" class="font-mono" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.5">DRISHTI // ARCHITECTURAL TOPOLOGY &amp; SENSING DOMAINS</text>
    <text x="730" y="6" class="font-mono" fill="#94a3b8" font-size="11">STATUS: CONTINUOUS RECON</text>
    <circle cx="890" cy="2" r="4" fill="#06b6d4" class="pulse-safe" />
  </g>

  <!-- ZONE 1: EXTERNAL / UNTRUSTED (X: 40-200) -->
  <g transform="translate(40, 90)">
    <rect width="180" height="440" rx="10" fill="#0d1527" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.85" />
    <rect x="12" y="12" width="156" height="24" rx="4" fill="#450a0a" />
    <text x="90" y="28" text-anchor="middle" class="font-mono" fill="#fca5a5" font-size="10" font-weight="700" letter-spacing="1">ZONE 0: EXTERNAL / WAN</text>

    <!-- External Attacker / Threat Actor -->
    <g transform="translate(25, 60)">
      <rect width="130" height="70" rx="6" fill="#18181b" stroke="#ef4444" stroke-width="1.5" />
      <circle cx="25" cy="25" r="8" fill="#ef4444" class="pulse-danger" />
      <text x="45" y="26" class="font-sans" fill="#ffffff" font-size="12" font-weight="700">Threat Actor</text>
      <text x="45" y="42" class="font-mono" fill="#f87171" font-size="10">0.0.0.0/0 (Internet)</text>
      <text x="45" y="56" class="font-mono" fill="#9ca3af" font-size="9">C2 / Ingress Scans</text>
    </g>

    <!-- Phishing / Malicious Domain -->
    <g transform="translate(25, 160)">
      <rect width="130" height="65" rx="6" fill="#18181b" stroke="#f97316" stroke-width="1.2" />
      <text x="65" y="24" text-anchor="middle" class="font-sans" fill="#ffffff" font-size="11" font-weight="600">Malicious URL / Host</text>
      <text x="65" y="40" text-anchor="middle" class="font-mono" fill="#fb923c" font-size="9">phish-portal.test</text>
      <text x="65" y="54" text-anchor="middle" class="font-mono" fill="#9ca3af" font-size="8.5">Observed in Live Stream</text>
    </g>

    <!-- External Edge Router -->
    <g transform="translate(25, 260)">
      <rect width="130" height="65" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.2" />
      <text x="65" y="25" text-anchor="middle" class="font-sans" fill="#e2e8f0" font-size="11" font-weight="600">Border Gateway</text>
      <text x="65" y="42" text-anchor="middle" class="font-mono" fill="#94a3b8" font-size="9">198.51.100.1</text>
      <text x="65" y="55" text-anchor="middle" class="font-mono" fill="#64748b" font-size="8.5">NAT &amp; BGP Border</text>
    </g>

    <text x="90" y="420" text-anchor="middle" class="font-mono" fill="#ef4444" font-size="9.5">UNTRUSTED INGRESS</text>
  </g>

  <!-- ZONE 2: PERIMETER & DMZ (X: 250-450) -->
  <g transform="translate(250, 90)">
    <rect width="210" height="440" rx="10" fill="#0d1527" stroke="#eab308" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.85" />
    <rect x="15" y="12" width="180" height="24" rx="4" fill="#422006" />
    <text x="105" y="28" text-anchor="middle" class="font-mono" fill="#fde047" font-size="10" font-weight="700" letter-spacing="1">ZONE 1: DMZ &amp; EDGE TIER</text>

    <!-- Perimeter Firewall -->
    <g transform="translate(25, 60)">
      <rect width="160" height="60" rx="6" fill="#1e293b" stroke="#eab308" stroke-width="1.5" />
      <text x="80" y="24" text-anchor="middle" class="font-sans" fill="#ffffff" font-size="11" font-weight="700">Perimeter Firewall</text>
      <text x="80" y="40" text-anchor="middle" class="font-mono" fill="#facc15" font-size="9.5">Stateful Ingress Filter</text>
      <text x="80" y="52" text-anchor="middle" class="font-mono" fill="#94a3b8" font-size="8.5">ACLs: 80/443 Allow</text>
    </g>

    <!-- Web App Server (Vulnerable Node) -->
    <g transform="translate(25, 155)">
      <rect width="160" height="75" rx="6" fill="#18181b" stroke="#f43f5e" stroke-width="1.5" />
      <circle cx="20" cy="24" r="6" fill="#f43f5e" class="pulse-danger" />
      <text x="35" y="24" class="font-sans" fill="#ffffff" font-size="11" font-weight="700">Edge Web Server</text>
      <text x="35" y="38" class="font-mono" fill="#fda4af" font-size="9">10.0.1.10 (DMZ-01)</text>
      <text x="35" y="52" class="font-mono" fill="#f43f5e" font-size="8.5">CVE-2021-44228 (Log4j)</text>
      <text x="35" y="65" class="font-mono" fill="#fb7185" font-size="8">Exposure: $420,000</text>
    </g>

    <!-- Reverse Proxy / NGINX -->
    <g transform="translate(25, 260)">
      <rect width="160" height="60" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="80" y="22" text-anchor="middle" class="font-sans" fill="#e2e8f0" font-size="11" font-weight="600">Reverse Proxy</text>
      <text x="80" y="38" text-anchor="middle" class="font-mono" fill="#38bdf8" font-size="9">10.0.1.15 : 443</text>
      <text x="80" y="50" text-anchor="middle" class="font-mono" fill="#94a3b8" font-size="8.5">TLS Termination</text>
    </g>

    <!-- Choke Point 1 Badge -->
    <g transform="translate(25, 350)">
      <rect width="160" height="50" rx="6" fill="#311042" stroke="#c084fc" stroke-width="1.2" />
      <text x="80" y="22" text-anchor="middle" class="font-mono" fill="#e9d5ff" font-size="9.5" font-weight="700">CHOKE POINT #1</text>
      <text x="80" y="38" text-anchor="middle" class="font-mono" fill="#c084fc" font-size="8.5">Edge Ingress Choke</text>
    </g>
  </g>

  <!-- ZONE 3: INTERNAL CORPORATE & ENDPOINTS (X: 490-710) -->
  <g transform="translate(490, 90)">
    <rect width="220" height="440" rx="10" fill="#0d1527" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.85" />
    <rect x="15" y="12" width="190" height="24" rx="4" fill="#172554" />
    <text x="110" y="28" text-anchor="middle" class="font-mono" fill="#93c5fd" font-size="10" font-weight="700" letter-spacing="1">ZONE 2: INTERNAL LAN / CORP</text>

    <!-- Workstation (Windows Agent) -->
    <g transform="translate(25, 60)">
      <rect width="170" height="65" rx="6" fill="#18181b" stroke="#06b6d4" stroke-width="1.3" />
      <circle cx="20" cy="22" r="5" fill="#06b6d4" />
      <text x="32" y="22" class="font-sans" fill="#ffffff" font-size="11" font-weight="700">Admin Workstation</text>
      <text x="32" y="37" class="font-mono" fill="#67e8f9" font-size="9">192.168.1.45 (Win 11)</text>
      <text x="32" y="50" class="font-mono" fill="#94a3b8" font-size="8.5">Drishti-Agent.exe Active</text>
    </g>

    <!-- Workstation (macOS Agent) -->
    <g transform="translate(25, 145)">
      <rect width="170" height="65" rx="6" fill="#18181b" stroke="#3b82f6" stroke-width="1.3" />
      <circle cx="20" cy="22" r="5" fill="#3b82f6" />
      <text x="32" y="22" class="font-sans" fill="#ffffff" font-size="11" font-weight="700">Developer MacBook</text>
      <text x="32" y="37" class="font-mono" fill="#93c5fd" font-size="9">192.168.1.88 (macOS)</text>
      <text x="32" y="50" class="font-mono" fill="#94a3b8" font-size="8.5">Telemetry Streamed</text>
    </g>

    <!-- Mobile Device (Android Agent) -->
    <g transform="translate(25, 230)">
      <rect width="170" height="65" rx="6" fill="#18181b" stroke="#10b981" stroke-width="1.3" />
      <circle cx="20" cy="22" r="5" fill="#10b981" />
      <text x="32" y="22" class="font-sans" fill="#ffffff" font-size="11" font-weight="700">Corporate Android</text>
      <text x="32" y="37" class="font-mono" fill="#6ee7b7" font-size="9">192.168.1.112 (Android 14)</text>
      <text x="32" y="50" class="font-mono" fill="#94a3b8" font-size="8.5">Drishti-Mobile-Agent.apk</text>
    </g>

    <!-- Pivot Choke Point -->
    <g transform="translate(25, 330)">
      <rect width="170" height="70" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.3" />
      <text x="85" y="22" text-anchor="middle" class="font-mono" fill="#c7d2fe" font-size="9.5" font-weight="700">INTERNAL CHOKE POINT</text>
      <text x="85" y="38" text-anchor="middle" class="font-sans" fill="#ffffff" font-size="10">Internal Core Switch / VLAN</text>
      <text x="85" y="52" text-anchor="middle" class="font-mono" fill="#818cf8" font-size="8.5">Risk Exposure: $1.85M</text>
    </g>
  </g>

  <!-- ZONE 4: CROWN JEWEL ENCLAVE (X: 740-960) -->
  <g transform="translate(740, 90)">
    <rect width="220" height="440" rx="10" fill="#0d1527" stroke="#10b981" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.85" />
    <rect x="15" y="12" width="190" height="24" rx="4" fill="#064e3b" />
    <text x="110" y="28" text-anchor="middle" class="font-mono" fill="#6ee7b7" font-size="10" font-weight="700" letter-spacing="1">ZONE 3: SECURE ENCLAVE</text>

    <!-- Active Directory / Domain Controller -->
    <g transform="translate(25, 60)">
      <rect width="170" height="70" rx="6" fill="#18181b" stroke="#eab308" stroke-width="1.3" />
      <circle cx="20" cy="22" r="5" fill="#eab308" />
      <text x="32" y="22" class="font-sans" fill="#ffffff" font-size="11" font-weight="700">Domain Controller</text>
      <text x="32" y="37" class="font-mono" fill="#fde047" font-size="9">10.0.3.5 (AD/Kerberos)</text>
      <text x="32" y="50" class="font-mono" fill="#94a3b8" font-size="8.5">Port 88/389/445</text>
      <text x="32" y="62" class="font-mono" fill="#fbbf24" font-size="8">Asset Value: $1,200,000</text>
    </g>

    <!-- Crown Jewel Production DB -->
    <g transform="translate(25, 155)">
      <rect width="170" height="85" rx="6" fill="#18181b" stroke="#10b981" stroke-width="2" filter="url(#soft-glow)" />
      <circle cx="20" cy="24" r="6" fill="#10b981" class="pulse-safe" />
      <text x="32" y="24" class="font-sans" fill="#ffffff" font-size="12" font-weight="800">Production DB Enclave</text>
      <text x="32" y="40" class="font-mono" fill="#34d399" font-size="9.5">10.0.3.100 (PostgreSQL)</text>
      <text x="32" y="54" class="font-mono" fill="#6ee7b7" font-size="8.5">PII &amp; Financial Ledger</text>
      <text x="32" y="68" class="font-mono" fill="#10b981" font-size="9" font-weight="700">CROWN JEWEL: $3,500,000</text>
    </g>

    <!-- Drishti Passive Watcher Sensor -->
    <g transform="translate(25, 270)">
      <rect width="170" height="75" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1.3" />
      <circle cx="20" cy="22" r="5" fill="#06b6d4" />
      <text x="32" y="22" class="font-sans" fill="#38bdf8" font-size="11" font-weight="700">Drishti Core Sensor</text>
      <text x="32" y="38" class="font-mono" fill="#94a3b8" font-size="9">Passive Sniffer (Zeek/Scapy)</text>
      <text x="32" y="52" class="font-mono" fill="#06b6d4" font-size="8.5">AF_PACKET / Npcap Driver</text>
      <text x="32" y="66" class="font-mono" fill="#38bdf8" font-size="8.5">No Packets Injected</text>
    </g>

    <!-- Security Guarantee Badge -->
    <g transform="translate(25, 365)">
      <rect width="170" height="35" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <text x="85" y="22" text-anchor="middle" class="font-mono" fill="#a7f3d0" font-size="8.5" font-weight="600">ZERO DATA LEAK GUARANTEE</text>
    </g>
  </g>

  <!-- INTER-ZONE CONNECTORS & ATTACK PATHS -->
  <!-- Threat Actor to Web Server (Compromise) -->
  <path d="M 195 185 L 275 220" stroke="#ef4444" stroke-width="2.2" class="dash-line-red" marker-end="url(#arrow-red)" />
  
  <!-- Web Server to Admin Workstation (Lateral Hop 1) -->
  <path d="M 435 225 L 515 155" stroke="#f43f5e" stroke-width="2" class="dash-line-red" marker-end="url(#arrow-red)" />

  <!-- Workstation to Internal Core Choke (Lateral Hop 2) -->
  <path d="M 600 210 L 600 330" stroke="#f43f5e" stroke-width="2" class="dash-line-red" marker-end="url(#arrow-red)" />

  <!-- Choke to Domain Controller (Pivot to Identity) -->
  <path d="M 685 365 Q 720 320 765 170" stroke="#ef4444" stroke-width="2" class="dash-line-red" marker-end="url(#arrow-red)" fill="none" />

  <!-- Domain Controller to Crown Jewel (Privilege Escalation to Target) -->
  <path d="M 850 200 L 850 245" stroke="#ef4444" stroke-width="2.5" class="dash-line-red" marker-end="url(#arrow-red)" />

  <!-- Drishti Continuous Passive Observation Lines (Cyan) -->
  <path d="M 850 345 L 850 325" stroke="#06b6d4" stroke-width="1.5" class="dash-line-cyan" marker-end="url(#arrow)" />
  <path d="M 765 310 Q 640 280 435 250" stroke="#06b6d4" stroke-width="1.2" class="dash-line-cyan" marker-end="url(#arrow)" fill="none" />

  <!-- Legend Bottom Bar -->
  <g transform="translate(40, 545)">
    <line x1="20" y1="10" x2="60" y2="10" stroke="#ef4444" stroke-width="2" class="dash-line-red" />
    <text x="70" y="14" class="font-mono" fill="#fca5a5" font-size="10">Active Lateral Attack Vector (Priced Path)</text>

    <line x1="330" y1="10" x2="370" y2="10" stroke="#06b6d4" stroke-width="1.8" class="dash-line-cyan" />
    <text x="380" y="14" class="font-mono" fill="#38bdf8" font-size="10">Drishti Passive Telemetry Ingestion</text>

    <circle cx="630" cy="10" r="5" fill="#10b981" />
    <text x="645" y="14" class="font-mono" fill="#6ee7b7" font-size="10">Enterprise Crown Jewel ($3.5M)</text>

    <rect x="830" y="2" width="16" height="16" rx="3" fill="#311042" stroke="#c084fc" stroke-width="1" />
    <text x="855" y="14" class="font-mono" fill="#d8b4fe" font-size="10">Graph Choke Point</text>
  </g>
</svg>
