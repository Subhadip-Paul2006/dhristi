<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" aria-label="Drishti Network Traffic Flow Simulation">
  <defs>
    <linearGradient id="tf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#070d18" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <filter id="tf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <marker id="tf-arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4" />
    </marker>
    <marker id="tf-arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; }

    @keyframes tf-dash {
      to { stroke-dashoffset: -32; }
    }
    @keyframes tf-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.12); opacity: 0.7; }
    }

    .tf-flow-cyan { stroke-dasharray: 8 8; animation: tf-dash 1.2s linear infinite; }
    .tf-flow-emerald { stroke-dasharray: 8 8; animation: tf-dash 1.8s linear infinite; }
    .tf-flow-amber { stroke-dasharray: 8 8; animation: tf-dash 1s linear infinite; }
    .tf-sensor-pulse { animation: tf-pulse 2.2s infinite ease-in-out; transform-origin: center; }

    @media (prefers-reduced-motion: reduce) {
      .tf-flow-cyan, .tf-flow-emerald, .tf-flow-amber, .tf-sensor-pulse {
        animation: none !important;
        stroke-dasharray: none !important;
      }
      circle[id^="packet-"] {
        display: none !important;
      }
    }
  </style>

  <!-- Background -->
  <rect width="960" height="520" fill="url(#tf-bg)" rx="14" />

  <!-- Grid Lines -->
  <g stroke="#172554" stroke-width="0.8" opacity="0.25">
    <line x1="80" y1="0" x2="80" y2="520" /><line x1="200" y1="0" x2="200" y2="520" />
    <line x1="320" y1="0" x2="320" y2="520" /><line x1="440" y1="0" x2="440" y2="520" />
    <line x1="560" y1="0" x2="560" y2="520" /><line x1="680" y1="0" x2="680" y2="520" />
    <line x1="800" y1="0" x2="800" y2="520" /><line x1="920" y1="0" x2="920" y2="520" />
    <line x1="0" y1="80" x2="960" y2="80" /><line x1="0" y1="180" x2="960" y2="180" />
    <line x1="0" y1="280" x2="960" y2="280" /><line x1="0" y1="380" x2="960" y2="380" />
    <line x1="0" y1="460" x2="960" y2="460" />
  </g>

  <!-- Title Header -->
  <g transform="translate(40, 35)">
    <rect x="0" y="0" width="880" height="42" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
    <circle cx="20" cy="21" r="5" fill="#06b6d4" />
    <text x="36" y="25" class="font-mono" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.2">DRISHTI // PASSIVE NETWORK TRAFFIC &amp; 5-TUPLE FLOW PIPELINE</text>
    <text x="690" y="25" class="font-mono" fill="#94a3b8" font-size="10.5">INGESTION: AF_PACKET / NPCAP</text>
  </g>

  <!-- LEFT: Network Nodes / Clients -->
  <g transform="translate(50, 110)">
    <!-- Node A: Workstation -->
    <g transform="translate(0, 0)">
      <rect width="180" height="70" rx="8" fill="#111827" stroke="#06b6d4" stroke-width="1.4" />
      <circle cx="22" cy="24" r="6" fill="#06b6d4" />
      <text x="36" y="24" class="font-sans" fill="#ffffff" font-size="11.5" font-weight="700">Host: Win11-Workstation</text>
      <text x="36" y="40" class="font-mono" fill="#38bdf8" font-size="10">IP: 192.168.1.45</text>
      <text x="36" y="54" class="font-mono" fill="#94a3b8" font-size="8.5">PID 4112 [chrome.exe]</text>
    </g>

    <!-- Node B: Developer Laptop -->
    <g transform="translate(0, 105)">
      <rect width="180" height="70" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="1.4" />
      <circle cx="22" cy="24" r="6" fill="#3b82f6" />
      <text x="36" y="24" class="font-sans" fill="#ffffff" font-size="11.5" font-weight="700">Host: MacBook-Pro</text>
      <text x="36" y="40" class="font-mono" fill="#60a5fa" font-size="10">IP: 192.168.1.88</text>
      <text x="36" y="54" class="font-mono" fill="#94a3b8" font-size="8.5">PID 1024 [curl / git]</text>
    </g>

    <!-- Node C: Rogue / Unknown Machine -->
    <g transform="translate(0, 210)">
      <rect width="180" height="70" rx="8" fill="#111827" stroke="#f59e0b" stroke-width="1.4" />
      <circle cx="22" cy="24" r="6" fill="#f59e0b" />
      <text x="36" y="24" class="font-sans" fill="#ffffff" font-size="11.5" font-weight="700">Unpaired Host (DHCP)</text>
      <text x="36" y="40" class="font-mono" fill="#fbbf24" font-size="10">IP: 192.168.1.205</text>
      <text x="36" y="54" class="font-mono" fill="#f59e0b" font-size="8.5">ARP Discovered (No Agent)</text>
    </g>

    <!-- Node D: Android Phone -->
    <g transform="translate(0, 315)">
      <rect width="180" height="70" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.4" />
      <circle cx="22" cy="24" r="6" fill="#10b981" />
      <text x="36" y="24" class="font-sans" fill="#ffffff" font-size="11.5" font-weight="700">Mobile: Pixel 8 (Android)</text>
      <text x="36" y="40" class="font-mono" fill="#34d399" font-size="10">IP: 192.168.1.112</text>
      <text x="36" y="54" class="font-mono" fill="#94a3b8" font-size="8.5">VPN Service Socket Trace</text>
    </g>
  </g>

  <!-- CENTER LEFT: Core Switch & Passive TAP Mirror -->
  <g transform="translate(300, 180)">
    <rect width="150" height="190" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
    <text x="75" y="28" text-anchor="middle" class="font-sans" fill="#ffffff" font-size="12" font-weight="700">Network Switch</text>
    <text x="75" y="44" text-anchor="middle" class="font-mono" fill="#94a3b8" font-size="9.5">VLAN 100 Core</text>

    <!-- Switch Ports -->
    <g transform="translate(15, 60)" fill="#1e293b" stroke="#334155">
      <rect x="0" y="0" width="24" height="20" rx="3" /><text x="12" y="14" fill="#06b6d4" font-size="8" text-anchor="middle" class="font-mono">P1</text>
      <rect x="32" y="0" width="24" height="20" rx="3" /><text x="44" y="14" fill="#3b82f6" font-size="8" text-anchor="middle" class="font-mono">P2</text>
      <rect x="64" y="0" width="24" height="20" rx="3" /><text x="76" y="14" fill="#f59e0b" font-size="8" text-anchor="middle" class="font-mono">P3</text>
      <rect x="96" y="0" width="24" height="20" rx="3" /><text x="108" y="14" fill="#10b981" font-size="8" text-anchor="middle" class="font-mono">P4</text>
    </g>

    <!-- Mirror Port (SPAN) -->
    <g transform="translate(15, 110)">
      <rect width="120" height="60" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2" />
      <text x="60" y="22" text-anchor="middle" class="font-mono" fill="#c7d2fe" font-size="10" font-weight="700">SPAN / TAP PORT</text>
      <text x="60" y="38" text-anchor="middle" class="font-mono" fill="#a5b4fc" font-size="8.5">Passive Mirror Copy</text>
      <text x="60" y="50" text-anchor="middle" class="font-mono" fill="#6ee7b7" font-size="8">Zero Packet Injection</text>
    </g>
  </g>

  <!-- CENTER RIGHT: Drishti Capture Adapter Pipeline -->
  <g transform="translate(520, 130)">
    <rect width="190" height="290" rx="10" fill="#091426" stroke="#06b6d4" stroke-width="1.8" filter="url(#tf-glow)" />
    <rect x="15" y="12" width="160" height="26" rx="4" fill="#0e3a5a" />
    <text x="95" y="29" text-anchor="middle" class="font-mono" fill="#67e8f9" font-size="10.5" font-weight="700">DRISHTI CAPTURE ADAPTER</text>

    <!-- Stage 1: Raw Packet Ingestion -->
    <g transform="translate(15, 52)">
      <rect width="160" height="48" rx="5" fill="#111c30" stroke="#1e3a5f" />
      <text x="80" y="20" text-anchor="middle" class="font-sans" fill="#ffffff" font-size="10" font-weight="600">1. Kernel Driver Layer</text>
      <text x="80" y="36" text-anchor="middle" class="font-mono" fill="#38bdf8" font-size="8.5">AF_PACKET / BPF / Npcap</text>
    </g>

    <!-- Stage 2: Packet Decoder -->
    <g transform="translate(15, 110)">
      <rect width="160" height="48" rx="5" fill="#111c30" stroke="#1e3a5f" />
      <text x="80" y="20" text-anchor="middle" class="font-sans" fill="#ffffff" font-size="10" font-weight="600">2. Packet Decoding Seam</text>
      <text x="80" y="36" text-anchor="middle" class="font-mono" fill="#a7f3d0" font-size="8.5">Zeek · TShark · Scapy 2.5</text>
    </g>

    <!-- Stage 3: 5-Tuple Aggregator -->
    <g transform="translate(15, 168)">
      <rect width="160" height="52" rx="5" fill="#111c30" stroke="#1e3a5f" />
      <text x="80" y="20" text-anchor="middle" class="font-sans" fill="#ffffff" font-size="10" font-weight="600">3. Session Flow Aggregator</text>
      <text x="80" y="35" text-anchor="middle" class="font-mono" fill="#fde047" font-size="8">5-Tuple: (Src, Dst, Ports, Proto)</text>
      <text x="80" y="46" text-anchor="middle" class="font-mono" fill="#94a3b8" font-size="7.5">Sliding 10s Window Engine</text>
    </g>

    <!-- Stage 4: Feature Vector Extractor -->
    <g transform="translate(15, 230)">
      <rect width="160" height="45" rx="5" fill="#1e1b4b" stroke="#a855f7" />
      <text x="80" y="18" text-anchor="middle" class="font-sans" fill="#ffffff" font-size="9.5" font-weight="600">4. Canonical Profiler</text>
      <text x="80" y="34" text-anchor="middle" class="font-mono" fill="#d8b4fe" font-size="8.5">27 Flow Metrics (Entropy, SYN)</text>
    </g>
  </g>

  <!-- RIGHT: Security Operations Intelligence -->
  <g transform="translate(760, 110)">
    <!-- Output 1: Live Watch Table -->
    <g transform="translate(0, 0)">
      <rect width="160" height="85" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.3" />
      <text x="80" y="22" text-anchor="middle" class="font-mono" fill="#6ee7b7" font-size="10" font-weight="700">LIVE WATCH CONSOLE</text>
      <text x="80" y="40" text-anchor="middle" class="font-sans" fill="#e2e8f0" font-size="9">Real-time Socket Grid</text>
      <text x="80" y="55" text-anchor="middle" class="font-mono" fill="#94a3b8" font-size="8">192.168.1.45:49812</text>
      <text x="80" y="70" text-anchor="middle" class="font-mono" fill="#34d399" font-size="8">PID 4112 Bound (Chrome)</text>
    </g>

    <!-- Output 2: Behavioral Anomaly Alert -->
    <g transform="translate(0, 105)">
      <rect width="160" height="85" rx="8" fill="#18181b" stroke="#f43f5e" stroke-width="1.3" />
      <text x="80" y="22" text-anchor="middle" class="font-mono" fill="#fda4af" font-size="10" font-weight="700">FLOW ANOMALY</text>
      <text x="80" y="40" text-anchor="middle" class="font-sans" fill="#ffffff" font-size="9">SYN-to-ACK Ratio Spike</text>
      <text x="80" y="55" text-anchor="middle" class="font-mono" fill="#fb7185" font-size="8">Ratio &gt; 4.8 (Port Scan)</text>
      <text x="80" y="70" text-anchor="middle" class="font-mono" fill="#f43f5e" font-size="8">MITRE: T1046 Network Scan</text>
    </g>

    <!-- Output 3: Yen's Graph Edge Injection -->
    <g transform="translate(0, 210)">
      <rect width="160" height="85" rx="8" fill="#111827" stroke="#8b5cf6" stroke-width="1.3" />
      <text x="80" y="22" text-anchor="middle" class="font-mono" fill="#c4b5fd" font-size="10" font-weight="700">ATTACK GRAPH FEED</text>
      <text x="80" y="40" text-anchor="middle" class="font-sans" fill="#e2e8f0" font-size="9">Dynamic Edge Weight</text>
      <text x="80" y="55" text-anchor="middle" class="font-mono" fill="#a78bfa" font-size="8">G.add_edge(host_a, host_b)</text>
      <text x="80" y="70" text-anchor="middle" class="font-mono" fill="#94a3b8" font-size="8">Informs Yen's K-Shortest</text>
    </g>

    <!-- Output 4: Telegram Security Alert -->
    <g transform="translate(0, 315)">
      <rect width="160" height="70" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.3" />
      <text x="80" y="22" text-anchor="middle" class="font-mono" fill="#38bdf8" font-size="10" font-weight="700">TELEGRAM ALERT</text>
      <text x="80" y="40" text-anchor="middle" class="font-sans" fill="#e2e8f0" font-size="9">Deduplicated Push</text>
      <text x="80" y="55" text-anchor="middle" class="font-mono" fill="#67e8f9" font-size="8">Alerting SecOps in &lt; 250ms</text>
    </g>
  </g>

  <!-- Connective Data Paths -->
  <!-- Nodes to Switch -->
  <path id="path-node-a" d="M 230 145 L 300 210" stroke="#06b6d4" stroke-width="1.8" class="tf-flow-cyan" />
  <path id="path-node-b" d="M 230 250 L 300 240" stroke="#3b82f6" stroke-width="1.8" class="tf-flow-cyan" />
  <path id="path-node-c" d="M 230 355 L 300 270" stroke="#f59e0b" stroke-width="1.8" class="tf-flow-amber" />
  <path id="path-node-d" d="M 230 460 L 300 300" stroke="#10b981" stroke-width="1.8" class="tf-flow-emerald" />

  <!-- Switch SPAN to Drishti Capture -->
  <path id="path-span-capture" d="M 450 320 Q 480 320 520 280" stroke="#818cf8" stroke-width="2.5" class="tf-flow-cyan" marker-end="url(#tf-arrow-cyan)" />

  <!-- Drishti Pipeline to Intelligence Outputs -->
  <path d="M 710 210 L 760 152" stroke="#10b981" stroke-width="1.8" class="tf-flow-emerald" marker-end="url(#tf-arrow-emerald)" />
  <path d="M 710 250 L 760 250" stroke="#f43f5e" stroke-width="1.8" class="tf-flow-amber" />
  <path d="M 710 310 L 760 350" stroke="#8b5cf6" stroke-width="1.8" class="tf-flow-cyan" marker-end="url(#tf-arrow-cyan)" />

  <!-- Animated Floating Packets -->
  <circle id="packet-1" r="4" fill="#38bdf8" filter="url(#tf-glow)">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M 230 145 L 300 210 L 450 320 Q 480 320 520 280 L 710 210 L 760 152" />
  </circle>

  <circle id="packet-2" r="4.5" fill="#f43f5e" filter="url(#tf-glow)">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M 230 355 L 300 270 L 450 320 Q 480 320 520 280 L 710 250 L 760 250" />
  </circle>

  <circle id="packet-3" r="4" fill="#34d399" filter="url(#tf-glow)">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M 230 460 L 300 300 L 450 320 Q 480 320 520 280 L 710 310 L 760 350" />
  </circle>

  <!-- Bottom Legend -->
  <g transform="translate(60, 485)">
    <circle cx="10" cy="10" r="5" fill="#06b6d4" />
    <text x="25" y="14" class="font-mono" fill="#94a3b8" font-size="9.5">Normal Telemetry Flow</text>

    <circle cx="210" cy="10" r="5" fill="#f59e0b" />
    <text x="225" y="14" class="font-mono" fill="#94a3b8" font-size="9.5">Unpaired Host Traffic</text>

    <circle cx="410" cy="10" r="5" fill="#f43f5e" />
    <text x="425" y="14" class="font-mono" fill="#94a3b8" font-size="9.5">Anomalous Flow Alert</text>

    <circle cx="610" cy="10" r="5" fill="#818cf8" />
    <text x="625" y="14" class="font-mono" fill="#94a3b8" font-size="9.5">Passive SPAN/Mirror Feed</text>
  </g>
</svg>
