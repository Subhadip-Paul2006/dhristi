<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%" aria-label="Drishti Attack Path Intelligence and Yen's K-Shortest Engine">
  <defs>
    <linearGradient id="ap-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <linearGradient id="ap-red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <linearGradient id="ap-jewel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <filter id="ap-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <marker id="ap-arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="ap-arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="ap-arrow-choke" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc" />
    </marker>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; }

    @keyframes ap-dash {
      to { stroke-dashoffset: -36; }
    }
    @keyframes ap-pulse-danger {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.7; }
    }
    @keyframes ap-pulse-choke {
      0%, 100% { stroke: #c084fc; stroke-width: 2; }
      50% { stroke: #f43f5e; stroke-width: 3.5; }
    }

    .ap-path-red { stroke-dasharray: 8 6; animation: ap-dash 1.1s linear infinite; }
    .ap-path-amber { stroke-dasharray: 6 6; animation: ap-dash 1.8s linear infinite; }
    .ap-node-pulse { animation: ap-pulse-danger 2s infinite ease-in-out; transform-origin: center; }
    .ap-choke-highlight { animation: ap-pulse-choke 2.5s infinite ease-in-out; }

    @media (prefers-reduced-motion: reduce) {
      .ap-path-red, .ap-path-amber, .ap-node-pulse, .ap-choke-highlight {
        animation: none !important;
        stroke-dasharray: none !important;
      }
    }
  </style>

  <!-- Background -->
  <rect width="1000" height="560" fill="url(#ap-bg)" rx="16" />

  <!-- Title Header -->
  <g transform="translate(40, 28)">
    <rect x="0" y="0" width="920" height="42" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.2" />
    <circle cx="20" cy="21" r="5" fill="#ef4444" />
    <text x="36" y="25" class="font-mono" fill="#f87171" font-size="12" font-weight="700" letter-spacing="1.2">DRISHTI // GRAPH-THEORETIC ATTACK PATH &amp; DOLLAR RISK VALUATION ENGINE</text>
    <text x="730" y="25" class="font-mono" fill="#38bdf8" font-size="10.5">YEN'S K-SHORTEST PATHS</text>
  </g>

  <!-- TOP SUMMARY BANNER: FINANCIAL EXPOSURE METRICS -->
  <g transform="translate(40, 85)">
    <rect width="920" height="52" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.2" />
    
    <g transform="translate(25, 16)">
      <text x="0" y="10" class="font-mono" fill="#a5b4fc" font-size="9.5">MAX CUMULATIVE EXPOSURE</text>
      <text x="0" y="26" class="font-mono" fill="#ef4444" font-size="14" font-weight="800">$3,500,000 USD</text>
    </g>

    <g transform="translate(240, 16)">
      <text x="0" y="10" class="font-mono" fill="#a5b4fc" font-size="9.5">CRITICAL CHOKE POINTS IDENTIFIED</text>
      <text x="0" y="26" class="font-mono" fill="#c084fc" font-size="14" font-weight="800">2 CHOKEPOINTS (MIN-CUT)</text>
    </g>

    <g transform="translate(500, 16)">
      <text x="0" y="10" class="font-mono" fill="#a5b4fc" font-size="9.5">RETURN ON MITIGATION (ROM)</text>
      <text x="0" y="26" class="font-mono" fill="#10b981" font-size="14" font-weight="800">92.4% RISK REDUCTION</text>
    </g>

    <g transform="translate(730, 16)">
      <text x="0" y="10" class="font-mono" fill="#a5b4fc" font-size="9.5">ENGINE EVALUATION SPEED</text>
      <text x="0" y="26" class="font-mono" fill="#38bdf8" font-size="14" font-weight="800">&lt; 45ms (NetworkX DiGraph)</text>
    </g>
  </g>

  <!-- NODE 1: EXTERNAL THREAT ACTOR (X: 50, Y: 240) -->
  <g transform="translate(50, 200)">
    <rect width="130" height="110" rx="8" fill="#18181b" stroke="#ef4444" stroke-width="1.8" />
    <circle cx="24" cy="24" r="8" fill="#ef4444" class="ap-node-pulse" />
    <text x="40" y="26" class="font-sans" fill="#ffffff" font-size="11" font-weight="700">Threat Actor</text>
    <text x="15" y="48" class="font-mono" fill="#f87171" font-size="9">Internet (WAN)</text>
    <text x="15" y="62" class="font-mono" fill="#9ca3af" font-size="8.5">Ingress Scanning</text>
    <text x="15" y="76" class="font-mono" fill="#9ca3af" font-size="8.5">CVSS: N/A (Attacker)</text>
    <rect x="15" y="85" width="100" height="16" rx="3" fill="#450a0a" />
    <text x="65" y="96" text-anchor="middle" class="font-mono" fill="#fca5a5" font-size="7.5">ENTRY HOPS: 0</text>
  </g>

  <!-- NODE 2: ENTRY POINT / DMZ WEB SERVER (X: 230, Y: 180) -->
  <g transform="translate(230, 170)">
    <rect width="155" height="150" rx="8" fill="#18181b" stroke="#ef4444" stroke-width="1.8" filter="url(#ap-glow)" />
    <circle cx="22" cy="24" r="6" fill="#ef4444" />
    <text x="36" y="24" class="font-sans" fill="#ffffff" font-size="11.5" font-weight="700">Edge Web Server</text>
    <text x="15" y="44" class="font-mono" fill="#38bdf8" font-size="9.5">10.0.1.10 (DMZ)</text>
    <text x="15" y="60" class="font-mono" fill="#fca5a5" font-size="8.5">Port 80/443 (Tomcat)</text>
    <text x="15" y="74" class="font-mono" fill="#f87171" font-size="8.5" font-weight="700">CVE-2021-44228 (Log4j)</text>
    <text x="15" y="88" class="font-mono" fill="#fca5a5" font-size="8.5">CVSS: 10.0 [CRITICAL]</text>
    <text x="15" y="102" class="font-mono" fill="#fca5a5" font-size="8.5">CISA KEV: EXPLOITED</text>
    
    <rect x="12" y="112" width="131" height="26" rx="4" fill="#450a0a" stroke="#b91c1c" />
    <text x="77" y="129" text-anchor="middle" class="font-mono" fill="#fecaca" font-size="9" font-weight="700">NODE RISK: $420,000</text>
  </g>

  <!-- CHOKE POINT 1 BADGE (Between Node 2 and Node 3) -->
  <g transform="translate(395, 150)">
    <rect width="40" height="180" rx="6" fill="#2e1065" class="ap-choke-highlight" />
    <text x="20" y="25" text-anchor="middle" class="font-mono" fill="#c084fc" font-size="10" font-weight="800">C</text>
    <text x="20" y="45" text-anchor="middle" class="font-mono" fill="#c084fc" font-size="10" font-weight="800">H</text>
    <text x="20" y="65" text-anchor="middle" class="font-mono" fill="#c084fc" font-size="10" font-weight="800">O</text>
    <text x="20" y="85" text-anchor="middle" class="font-mono" fill="#c084fc" font-size="10" font-weight="800">K</text>
    <text x="20" y="105" text-anchor="middle" class="font-mono" fill="#c084fc" font-size="10" font-weight="800">E</text>
    <text x="20" y="130" text-anchor="middle" class="font-mono" fill="#f43f5e" font-size="12" font-weight="800">#1</text>
    <text x="20" y="155" text-anchor="middle" class="font-mono" fill="#93c5fd" font-size="7.5">DMZ</text>
    <text x="20" y="168" text-anchor="middle" class="font-mono" fill="#93c5fd" font-size="7.5">ACL</text>
  </g>

  <!-- NODE 3: LATERAL PIVOT / ADMIN WORKSTATION (X: 450, Y: 170) -->
  <g transform="translate(450, 170)">
    <rect width="155" height="150" rx="8" fill="#18181b" stroke="#f59e0b" stroke-width="1.8" />
    <circle cx="22" cy="24" r="6" fill="#f59e0b" />
    <text x="36" y="24" class="font-sans" fill="#ffffff" font-size="11.5" font-weight="700">Admin Workstation</text>
    <text x="15" y="44" class="font-mono" fill="#38bdf8" font-size="9.5">192.168.1.45 (Corp)</text>
    <text x="15" y="60" class="font-mono" fill="#fbbf24" font-size="8.5">Port 445 (SMB) Exposed</text>
    <text x="15" y="74" class="font-mono" fill="#f59e0b" font-size="8.5" font-weight="700">CVE-2017-0144 (EternalB)</text>
    <text x="15" y="88" class="font-mono" fill="#fbbf24" font-size="8.5">CVSS: 8.1 [HIGH]</text>
    <text x="15" y="102" class="font-mono" fill="#94a3b8" font-size="8.5">Cached Domain Admin Token</text>
    
    <rect x="12" y="112" width="131" height="26" rx="4" fill="#422006" stroke="#d97706" />
    <text x="77" y="129" text-anchor="middle" class="font-mono" fill="#fde68a" font-size="9" font-weight="700">NODE RISK: $780,000</text>
  </g>

  <!-- CHOKE POINT 2 BADGE (Strategic Choke) -->
  <g transform="translate(615, 150)">
    <rect width="40" height="180" rx="6" fill="#2e1065" class="ap-choke-highlight" />
    <text x="20" y="25" text-anchor="middle" class="font-mono" fill="#c084fc" font-size="10" font-weight="800">C</text>
    <text x="20" y="45" text-anchor="middle" class="font-mono" fill="#c084fc" font-size="10" font-weight="800">H</text>
    <text x="20" y="65" text-anchor="middle" class="font-mono" fill="#c084fc" font-size="10" font-weight="800">O</text>
    <text x="20" y="85" text-anchor="middle" class="font-mono" fill="#c084fc" font-size="10" font-weight="800">K</text>
    <text x="20" y="105" text-anchor="middle" class="font-mono" fill="#c084fc" font-size="10" font-weight="800">E</text>
    <text x="20" y="130" text-anchor="middle" class="font-mono" fill="#10b981" font-size="12" font-weight="800">#2</text>
    <text x="20" y="155" text-anchor="middle" class="font-mono" fill="#93c5fd" font-size="7.5">VLAN</text>
    <text x="20" y="168" text-anchor="middle" class="font-mono" fill="#93c5fd" font-size="7.5">GATE</text>
  </g>

  <!-- NODE 4: IDENTITY TARGET / DOMAIN CONTROLLER (X: 670, Y: 170) -->
  <g transform="translate(670, 170)">
    <rect width="145" height="150" rx="8" fill="#18181b" stroke="#eab308" stroke-width="1.8" />
    <circle cx="22" cy="24" r="6" fill="#eab308" />
    <text x="36" y="24" class="font-sans" fill="#ffffff" font-size="11.5" font-weight="700">Domain Controller</text>
    <text x="15" y="44" class="font-mono" fill="#38bdf8" font-size="9.5">10.0.3.5 (Active Dir)</text>
    <text x="15" y="60" class="font-mono" fill="#fde047" font-size="8.5">Port 88 (Kerberos)</text>
    <text x="15" y="74" class="font-mono" fill="#fde047" font-size="8.5" font-weight="700">CVE-2020-1472 (ZeroLogon)</text>
    <text x="15" y="88" class="font-mono" fill="#fde047" font-size="8.5">CVSS: 10.0 [CRITICAL]</text>
    <text x="15" y="102" class="font-mono" fill="#94a3b8" font-size="8.5">Full Domain Escalation</text>
    
    <rect x="12" y="112" width="121" height="26" rx="4" fill="#422006" stroke="#ca8a04" />
    <text x="72" y="129" text-anchor="middle" class="font-mono" fill="#fef08a" font-size="9" font-weight="700">EXPOSURE: $1.2M</text>
  </g>

  <!-- NODE 5: CROWN JEWEL DATABASE (X: 835, Y: 160) -->
  <g transform="translate(835, 150)">
    <rect width="135" height="175" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="2.5" filter="url(#ap-glow)" />
    <circle cx="22" cy="24" r="6" fill="#34d399" />
    <text x="36" y="24" class="font-sans" fill="#ffffff" font-size="11.5" font-weight="800">CROWN JEWEL</text>
    <text x="12" y="46" class="font-mono" fill="#a7f3d0" font-size="9.5">Production DB Enclave</text>
    <text x="12" y="62" class="font-mono" fill="#6ee7b7" font-size="8.5">10.0.3.100 (Postgres)</text>
    <text x="12" y="76" class="font-mono" fill="#94a3b8" font-size="8">PII · Financial Accounts</text>
    <text x="12" y="90" class="font-mono" fill="#94a3b8" font-size="8">Regulatory: GDPR / PCI</text>
    
    <!-- Big Price Badge -->
    <rect x="10" y="102" width="115" height="55" rx="6" fill="#022c22" stroke="#34d399" stroke-width="1.5" />
    <text x="67" y="122" text-anchor="middle" class="font-mono" fill="#6ee7b7" font-size="8.5" font-weight="700">VALUATION</text>
    <text x="67" y="144" text-anchor="middle" class="font-mono" fill="#34d399" font-size="13" font-weight="900">$3.5M USD</text>
  </g>

  <!-- Connective Attack Vectors (Yen's Path 1 - Red) -->
  <path d="M 180 255 L 230 255" stroke="#ef4444" stroke-width="2.8" class="ap-path-red" marker-end="url(#ap-arrow-red)" />
  <path d="M 385 255 L 450 255" stroke="#ef4444" stroke-width="2.8" class="ap-path-red" marker-end="url(#ap-arrow-red)" />
  <path d="M 605 255 L 670 255" stroke="#ef4444" stroke-width="2.8" class="ap-path-red" marker-end="url(#ap-arrow-red)" />
  <path d="M 815 255 L 835 255" stroke="#ef4444" stroke-width="3.2" class="ap-path-red" marker-end="url(#ap-arrow-red)" />

  <!-- Alternative Bypassed Path (Yen's Path 2 - Amber Dashed) -->
  <path d="M 310 320 Q 380 410 520 410 Q 720 410 835 290" stroke="#f59e0b" stroke-width="2" class="ap-path-amber" fill="none" marker-end="url(#ap-arrow-amber)" />
  <text x="530" y="425" text-anchor="middle" class="font-mono" fill="#fbbf24" font-size="9">Yen's K-Shortest Path #2: Bypasses Domain Controller via Direct DB Connection ($2.1M)</text>

  <!-- BOTTOM EXPLANATORY PANEL -->
  <g transform="translate(40, 440)">
    <rect width="920" height="95" rx="8" fill="#111827" stroke="#1f2937" />
    <text x="20" y="24" class="font-mono" fill="#38bdf8" font-size="10.5" font-weight="700">GRAPH-THEORETIC CHOKE POINT DEFENSE VS BRUTE-FORCE VULN PATCHING:</text>
    <text x="20" y="44" class="font-sans" fill="#e2e8f0" font-size="9.5">
      Traditional security teams attempt to patch all 14 vulnerabilities across all nodes simultaneously.
    </text>
    <text x="20" y="62" class="font-sans" fill="#34d399" font-size="9.5" font-weight="600">
      Drishti's Min-Cut Algorithm proves that severing CHOKE POINT #2 (blocking Corp-to-Enclave port 88/445 via Cisco ACL or Ansible)
      neutralizes BOTH Path #1 and Path #2, eliminating 92.4% ($3.2M) of corporate breach exposure with a single 4-line rule.
    </text>
    <text x="20" y="80" class="font-mono" fill="#a78bfa" font-size="8.5">
      Mathematically Verified: Return on Mitigation (ROM) = (Risk_Before - Risk_After) / Implementation_Friction &gt; 92.4%
    </text>
  </g>
</svg>
