    <rect x="15" y="15" width="170" height="24" rx="4" fill="#0e3a5a" />
    <text x="100" y="31" text-anchor="middle" class="font-mono" fill="#7dd3fc" font-size="10" font-weight="700">1. GROUNDED CONTEXT</text>

    <!-- Context Element 1: Graph Path -->
    <g transform="translate(15, 55)">
      <rect width="170" height="75" rx="5" fill="#111827" stroke="#334155" />
      <text x="12" y="20" class="font-mono" fill="#38bdf8" font-size="9" font-weight="700">NETWORKX GRAPH</text>
      <text x="12" y="36" class="font-mono" fill="#94a3b8" font-size="8">Active Breach Route:</text>
      <text x="12" y="50" class="font-mono" fill="#fca5a5" font-size="7.5">DMZ -&gt; Corp -&gt; DC -&gt; DB</text>
      <text x="12" y="64" class="font-mono" fill="#ef4444" font-size="7.5">Path Exposure: $3.5M</text>
    </g>

    <!-- Context Element 2: Vulnerability Evidence -->
    <g transform="translate(15, 140)">
      <rect width="170" height="85" rx="5" fill="#111827" stroke="#334155" />
      <text x="12" y="20" class="font-mono" fill="#f87171" font-size="9" font-weight="700">VULN EVIDENCE</text>
      <text x="12" y="36" class="font-mono" fill="#94a3b8" font-size="8">Product: Apache Tomcat</text>
      <text x="12" y="48" class="font-mono" fill="#fca5a5" font-size="7.5">CVE-2021-44228 (Log4j)</text>
      <text x="12" y="60" class="font-mono" fill="#94a3b8" font-size="7.5">OS: Ubuntu 22.04 LTS</text>
      <text x="12" y="74" class="font-mono" fill="#34d399" font-size="7.5">Evidence Tier: CONFIRMED</text>
    </g>

    <!-- Context Element 3: Choke Point Spec -->
    <g transform="translate(15, 235)">
      <rect width="170" height="85" rx="5" fill="#18181b" stroke="#c084fc" />
      <text x="12" y="20" class="font-mono" fill="#d8b4fe" font-size="9" font-weight="700">TARGET CHOKEPOINT</text>
      <text x="12" y="36" class="font-sans" fill="#e2e8f0" font-size="8">High-leverage switch port</text>
      <text x="12" y="50" class="font-mono" fill="#c084fc" font-size="7.5">Device: Cisco Catalyst</text>
      <text x="12" y="64" class="font-mono" fill="#94a3b8" font-size="7.5">Subnet: 10.0.1.0/24</text>
      <text x="12" y="78" class="font-mono" fill="#10b981" font-size="7.5">Goal: Block Lateral 445/88</text>
    </g>

    <text x="100" y="348" text-anchor="middle" class="font-mono" fill="#94a3b8" font-size="8">Strict Zero-Fabrication</text>
  </g>

  <!-- STAGE 2: CLAUDE LLM REASONING (X: 260) -->
  <g transform="translate(260, 95)">
    <rect width="210" height="370" rx="10" fill="#0d172a" stroke="#6b21a8" stroke-width="1.5" />
    <rect x="15" y="15" width="180" height="24" rx="4" fill="#3b0764" />
    <text x="105" y="31" text-anchor="middle" class="font-mono" fill="#e9d5ff" font-size="10" font-weight="700">2. CLAUDE 3.5 SONNET</text>

    <!-- LLM Card -->
    <g transform="translate(15, 52)">
