    <text x="100" y="31" text-anchor="middle" class="font-mono" fill="#a7f3d0" font-size="10" font-weight="700">4. AUDITED PLAYBOOKS</text>

    <!-- Verified Playbook 1: Ansible -->
    <g transform="translate(15, 52)">
      <rect width="170" height="95" rx="6" fill="#111827" stroke="#10b981" />
      <text x="12" y="20" class="font-mono" fill="#34d399" font-size="9" font-weight="700">ANSIBLE PLAYBOOK</text>
      <text x="12" y="36" class="font-mono" fill="#94a3b8" font-size="7.5">- name: Patch Log4j</text>
      <text x="12" y="48" class="font-mono" fill="#94a3b8" font-size="7.5">  hosts: dmz_servers</text>
      <text x="12" y="60" class="font-mono" fill="#94a3b8" font-size="7.5">  tasks:</text>
      <text x="12" y="72" class="font-mono" fill="#34d399" font-size="7.5">    - apt: name=tomcat</text>
      <text x="12" y="84" class="font-mono" fill="#34d399" font-size="7.5">      state=latest</text>
    </g>

    <!-- Verified Playbook 2: Cisco ACL -->
    <g transform="translate(15, 155)">
      <rect width="170" height="95" rx="6" fill="#111827" stroke="#10b981" />
      <text x="12" y="20" class="font-mono" fill="#34d399" font-size="9" font-weight="700">CISCO IOS ACL</text>
      <text x="12" y="36" class="font-mono" fill="#6ee7b7" font-size="7.5">ip access-list extended 101</text>
      <text x="12" y="48" class="font-mono" fill="#f87171" font-size="7.5"> deny tcp 10.0.1.0 0.0.0.255</text>
      <text x="12" y="60" class="font-mono" fill="#f87171" font-size="7.5"> host 10.0.3.5 eq 88</text>
      <text x="12" y="72" class="font-mono" fill="#34d399" font-size="7.5"> permit ip any any</text>
      <text x="12" y="86" class="font-mono" fill="#10b981" font-size="7.5">Severed Choke Point #2</text>
    </g>

    <!-- Human Validation Gate -->
    <g transform="translate(15, 260)">
      <rect width="170" height="85" rx="6" fill="#182235" stroke="#38bdf8" />
      <text x="85" y="22" text-anchor="middle" class="font-mono" fill="#38bdf8" font-size="9" font-weight="700">HUMAN IN THE LOOP</text>
      <text x="85" y="38" text-anchor="middle" class="font-sans" fill="#e2e8f0" font-size="8">One-click copy &amp; verify</text>
      <text x="85" y="52" text-anchor="middle" class="font-sans" fill="#94a3b8" font-size="8">Never auto-applied without</text>
      <text x="85" y="66" text-anchor="middle" class="font-mono" fill="#34d399" font-size="8">SecOps Approval</text>
    </g>
  </g>

  <!-- Connective Arrows -->
  <path d="M 240 280 L 260 280" stroke="#06b6d4" stroke-width="2" class="ai-stream" marker-end="url(#ai-arrow-cyan)" />
  <path d="M 470 280 L 490 280" stroke="#a855f7" stroke-width="2" class="ai-stream" marker-end="url(#ai-arrow-purple)" />
  <path d="M 700 280 L 720 280" stroke="#10b981" stroke-width="2" class="ai-stream" marker-end="url(#ai-arrow-emerald)" />

  <!-- Bottom Legend -->
  <g transform="translate(60, 485)">
    <circle cx="10" cy="10" r="5" fill="#38bdf8" />
    <text x="25" y="14" class="font-mono" fill="#94a3b8" font-size="9.5">Observed Telemetry Ingestion</text>

    <circle cx="250" cy="10" r="5" fill="#a855f7" />
    <text x="265" y="14" class="font-mono" fill="#94a3b8" font-size="9.5">Claude 3.5 Sonnet Reasoning</text>

    <circle cx="490" cy="10" r="5" fill="#ef4444" />
    <text x="505" y="14" class="font-mono" fill="#94a3b8" font-size="9.5">Deterministic AST Guardrail</text>

    <circle cx="730" cy="10" r="5" fill="#10b981" />
    <text x="745" y="14" class="font-mono" fill="#94a3b8" font-size="9.5">Verified Defensive Playbook</text>
