      <text x="90" y="22" text-anchor="middle" class="font-sans" fill="#ffffff" font-size="11" font-weight="700">AI Remediation Agent</text>
      <text x="90" y="38" text-anchor="middle" class="font-mono" fill="#c084fc" font-size="8.5">server/app/services/ai.py</text>
      <text x="90" y="55" text-anchor="middle" class="font-mono" fill="#e9d5ff" font-size="8">Model: claude-3-5-sonnet</text>
      <text x="90" y="70" text-anchor="middle" class="font-sans" fill="#94a3b8" font-size="8">System Prompt: Hardening Only</text>
      <text x="90" y="85" text-anchor="middle" class="font-sans" fill="#94a3b8" font-size="8">Generates Config Artifacts</text>
      <text x="90" y="100" text-anchor="middle" class="font-mono" fill="#38bdf8" font-size="7.5">Zero Training on User Data</text>
    </g>

    <!-- Generation Options -->
    <g transform="translate(15, 175)">
      <rect width="180" height="160" rx="6" fill="#111827" stroke="#334155" />
      <text x="12" y="20" class="font-mono" fill="#a78bfa" font-size="9" font-weight="700">GENERATION TARGETS:</text>
      
      <text x="12" y="42" class="font-mono" fill="#38bdf8" font-size="8.5">• Ansible Playbooks (.yml)</text>
      <text x="24" y="56" class="font-sans" fill="#94a3b8" font-size="7.5">Idempotent service stop &amp; patch</text>

      <text x="12" y="76" class="font-mono" fill="#fde047" font-size="8.5">• Cisco IOS ACL Rules</text>
      <text x="24" y="90" class="font-sans" fill="#94a3b8" font-size="7.5">Standard &amp; Extended Access Lists</text>

      <text x="12" y="110" class="font-mono" fill="#67e8f9" font-size="8.5">• PowerShell / Bash Scripts</text>
      <text x="24" y="124" class="font-sans" fill="#94a3b8" font-size="7.5">Disable SMBv1, isolate host</text>

      <text x="12" y="144" class="font-mono" fill="#34d399" font-size="8.5">• Incident Response Plan</text>
    </g>
  </g>

  <!-- STAGE 3: ABSTRACT SYNTAX TREE (AST) GUARDRAIL (X: 490) -->
  <g transform="translate(490, 95)">
    <rect width="210" height="370" rx="10" fill="#0d172a" stroke="#dc2626" stroke-width="1.8" />
