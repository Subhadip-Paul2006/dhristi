      <text x="12" y="20" class="font-mono" fill="#f87171" font-size="9" font-weight="700">AST STATIC ANALYSIS</text>
      <text x="12" y="36" class="font-mono" fill="#94a3b8" font-size="8">Python: ast.parse()</text>
      <text x="12" y="50" class="font-sans" fill="#e2e8f0" font-size="8">Recursively inspects nodes</text>
      <text x="12" y="64" class="font-sans" fill="#e2e8f0" font-size="8">before delivering to analyst</text>
      <text x="12" y="80" class="font-mono" fill="#ef4444" font-size="7.5">Zero Hallucinated Exploits</text>
    </g>

    <!-- Blocked Invariants List -->
    <g transform="translate(15, 150)">
      <rect width="180" height="185" rx="6" fill="#18181b" stroke="#b91c1c" />
      <text x="12" y="20" class="font-mono" fill="#fca5a5" font-size="8.5" font-weight="700">UNCONDITIONALLY BLOCKED:</text>
      
      <g transform="translate(12, 32)" class="font-mono" font-size="7.5" fill="#f87171">
        <text x="0" y="12">• rm -rf /* / rmdir /s /q</text>
        <text x="0" y="26">• dd if=/dev/zero ...</text>
        <text x="0" y="40">• mkfs / format C:</text>
        <text x="0" y="54">• shutdown / reboot</text>
        <text x="0" y="68">• iptables -F (flush all)</text>
        <text x="0" y="82">• curl | bash (remote eval)</text>
        <text x="0" y="96">• DROP DATABASE / TRUNCATE</text>
        <text x="0" y="110">• Exploit payload injection</text>
        <text x="0" y="124">• Reverse shell sockets</text>
      </g>

      <rect x="12" y="162" width="156" height="16" rx="3" fill="#450a0a" />
      <text x="90" y="174" text-anchor="middle" class="font-mono" fill="#fca5a5" font-size="7.5">EXIT CODE 1 ON VIOLATION</text>
    </g>
  </g>

  <!-- STAGE 4: PRODUCTION-READY REMEDIATION (X: 720) -->
  <g transform="translate(720, 95)">
    <rect width="200" height="370" rx="10" fill="#0d172a" stroke="#059669" stroke-width="1.5" />
