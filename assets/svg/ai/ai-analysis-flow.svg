<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" aria-label="Drishti AI Reasoning and AST Guardrail Pipeline">
  <defs>
    <linearGradient id="ai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d18" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <filter id="ai-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <marker id="ai-arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4" />
    </marker>
    <marker id="ai-arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="ai-arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; }

    @keyframes ai-dash {
      to { stroke-dashoffset: -32; }
    }
    @keyframes ai-glow-pulse {
      0%, 100% { filter: drop-shadow(0 0 4px #a855f7); }
      50% { filter: drop-shadow(0 0 12px #c084fc); }
    }

    .ai-stream { stroke-dasharray: 6 6; animation: ai-dash 1.2s linear infinite; }
    .ai-brain-pulse { animation: ai-glow-pulse 2.5s infinite ease-in-out; }

    @media (prefers-reduced-motion: reduce) {
      .ai-stream, .ai-brain-pulse {
        animation: none !important;
        stroke-dasharray: none !important;
      }
    }
  </style>

  <!-- Background -->
  <rect width="960" height="520" fill="url(#ai-bg)" rx="14" />

  <!-- Title Header -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="880" height="42" rx="8" fill="#111c30" stroke="#1e293b" stroke-width="1.2" />
    <circle cx="20" cy="21" r="5" fill="#a855f7" />
    <text x="36" y="25" class="font-mono" fill="#d8b4fe" font-size="12" font-weight="700" letter-spacing="1.2">DRISHTI // AI-ASSISTED REASONING &amp; AST GUARDRAIL MITIGATION ENGINE</text>
    <text x="690" y="25" class="font-mono" fill="#10b981" font-size="10.5">NON-DESTRUCTIVE DEFENSE</text>
  </g>

  <!-- STAGE 1: TELEMETRIC CONTEXT INGESTION (X: 40) -->
