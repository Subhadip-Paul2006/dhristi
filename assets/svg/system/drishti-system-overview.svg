      <text x="30" y="36" class="font-mono" fill="#fbbf24" font-size="8.5">drishti_watch.py</text>
      <text x="15" y="52" class="font-sans" fill="#94a3b8" font-size="8">• ARP Table / mDNS / DNS PTR</text>
      <text x="15" y="66" class="font-sans" fill="#94a3b8" font-size="8">• Zeek / TShark / Scapy Seam</text>
      <text x="15" y="80" class="font-mono" fill="#34d399" font-size="7.5">Zero Packet Injection</text>
    </g>
  </g>

