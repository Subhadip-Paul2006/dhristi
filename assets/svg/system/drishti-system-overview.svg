      <circle cx="18" cy="20" r="5" fill="#10b981" />
      <text x="30" y="21" class="font-sans" fill="#ffffff" font-size="10.5" font-weight="700">Android Agent</text>
      <text x="30" y="36" class="font-mono" fill="#6ee7b7" font-size="8.5">Drishti-Agent.apk (API 34+)</text>
      <text x="15" y="52" class="font-sans" fill="#94a3b8" font-size="8">• Android Keystore Encryption</text>
      <text x="15" y="66" class="font-sans" fill="#94a3b8" font-size="8">• VpnService Traffic Inspection</text>
      <text x="15" y="80" class="font-mono" fill="#34d399" font-size="7.5">Compiled Release: dist/apk</text>
