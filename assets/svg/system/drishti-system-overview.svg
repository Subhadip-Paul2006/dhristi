    <rect x="15" y="12" width="180" height="26" rx="4" fill="#0e3a5a" />
    <text x="105" y="29" text-anchor="middle" class="font-mono" fill="#7dd3fc" font-size="10.5" font-weight="700">1. SENSING PLANE</text>

    <!-- Component 1: Windows Agent -->
    <g transform="translate(15, 50)">
      <rect width="180" height="85" rx="6" fill="#111827" stroke="#06b6d4" />
      <circle cx="18" cy="20" r="5" fill="#06b6d4" />
      <text x="30" y="21" class="font-sans" fill="#ffffff" font-size="10.5" font-weight="700">Windows Daemon</text>
      <text x="30" y="36" class="font-mono" fill="#67e8f9" font-size="8.5">Drishti-Agent.exe</text>
      <text x="15" y="52" class="font-sans" fill="#94a3b8" font-size="8">• Win32 GetExtendedTcpTable</text>
      <text x="15" y="66" class="font-sans" fill="#94a3b8" font-size="8">• Registry &amp; Process PID Trace</text>
      <text x="15" y="79" class="font-mono" fill="#34d399" font-size="7.5">Standalone PyInstaller Binary</text>
