<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 600" width="100%" height="100%" aria-label="Drishti Full-System Architectural Overview">
  <defs>
    <linearGradient id="so-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <linearGradient id="so-cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <filter id="so-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <marker id="so-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4" />
    </marker>
    <marker id="so-arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; }

    @keyframes so-dash {
      to { stroke-dashoffset: -32; }
    }
    @keyframes so-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .so-stream { stroke-dasharray: 6 6; animation: so-dash 1.4s linear infinite; }
    .so-stream-fast { stroke-dasharray: 6 4; animation: so-dash 0.9s linear infinite; }
    .so-pulse-dot { animation: so-pulse 2s infinite ease-in-out; }

    @media (prefers-reduced-motion: reduce) {
      .so-stream, .so-stream-fast, .so-pulse-dot {
        animation: none !important;
        stroke-dasharray: none !important;
      }
    }
  </style>

  <!-- Background -->
  <rect width="1020" height="600" fill="url(#so-bg)" rx="16" />

  <!-- Master Title Header -->
  <g transform="translate(40, 25)">
    <rect x="0" y="0" width="940" height="44" rx="8" fill="#111827" stroke="#1e293b" stroke-width="1.2" />
    <circle cx="20" cy="22" r="6" fill="#06b6d4" class="so-pulse-dot" />
    <text x="36" y="27" class="font-mono" fill="#38bdf8" font-size="12.5" font-weight="700" letter-spacing="1.5">DRISHTI // FULL-STACK SYSTEM TOPOLOGY &amp; ARCHITECTURAL SPECIFICATION</text>
    <text x="760" y="27" class="font-mono" fill="#10b981" font-size="11">PRODUCTION READY</text>
  </g>

