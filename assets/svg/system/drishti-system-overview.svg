    <!-- Component 2: macOS Agent -->
    <g transform="translate(15, 145)">
      <rect width="180" height="85" rx="6" fill="#111827" stroke="#3b82f6" />
      <circle cx="18" cy="20" r="5" fill="#3b82f6" />
      <text x="30" y="21" class="font-sans" fill="#ffffff" font-size="10.5" font-weight="700">macOS Agent</text>
      <text x="30" y="36" class="font-mono" fill="#93c5fd" font-size="8.5">Drishti-Agent.pkg</text>
      <text x="15" y="52" class="font-sans" fill="#94a3b8" font-size="8">• sysctl &amp; libproc Telemetry</text>
      <text x="15" y="66" class="font-sans" fill="#94a3b8" font-size="8">• Launchd Background Daemon</text>
      <text x="15" y="79" class="font-mono" fill="#34d399" font-size="7.5">User-Space Least Privilege</text>
