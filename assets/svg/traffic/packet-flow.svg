<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" aria-label="Drishti Low-Level Packet Flow Pipeline">
  <defs>
    <linearGradient id="pf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="50%" stop-color="#0c1527" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <filter id="pf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <marker id="pf-arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4" />
    </marker>
    <marker id="pf-arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; }

    @keyframes pf-dash {
      to { stroke-dashoffset: -32; }
    }
    @keyframes pf-pulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.4; }
    }

    .pf-stream { stroke-dasharray: 8 6; animation: pf-dash 1.2s linear infinite; }
    .pf-stream-fast { stroke-dasharray: 6 4; animation: pf-dash 0.8s linear infinite; }
    .pf-pulse-ring { animation: pf-pulse 2s infinite ease-in-out; }

    @media (prefers-reduced-motion: reduce) {
      .pf-stream, .pf-stream-fast, .pf-pulse-ring {
        animation: none !important;
        stroke-dasharray: none !important;
      }
    }
  </style>

  <!-- Background -->
  <rect width="960" height="520" fill="url(#pf-bg)" rx="14" />

  <!-- Title Header -->
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="880" height="42" rx="8" fill="#111c30" stroke="#1e293b" stroke-width="1.2" />
    <circle cx="20" cy="21" r="5" fill="#06b6d4" />
    <text x="36" y="25" class="font-mono" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.2">DRISHTI // KERNEL PACKET INGESTION &amp; DECAPSULATION ENGINE</text>
    <text x="700" y="25" class="font-mono" fill="#10b981" font-size="10.5">RING BUFFER ZERO-COPY</text>
  </g>

  <!-- STAGE 1: PHYSICAL NIC / INTERFACE -->
  <g transform="translate(40, 95)">
    <rect width="180" height="370" rx="10" fill="#0d172a" stroke="#334155" stroke-width="1.3" />
    <rect x="15" y="15" width="150" height="24" rx="4" fill="#1e293b" />
    <text x="90" y="31" text-anchor="middle" class="font-mono" fill="#e2e8f0" font-size="10" font-weight="700">1. NIC &amp; DRIVER</text>

    <!-- Network Card Graphic -->
    <g transform="translate(20, 55)">
      <rect width="140" height="90" rx="6" fill="#182235" stroke="#06b6d4" stroke-width="1.5" />
      <text x="70" y="26" text-anchor="middle" class="font-sans" fill="#ffffff" font-size="11" font-weight="700">Hardware NIC</text>
      <text x="70" y="44" text-anchor="middle" class="font-mono" fill="#38bdf8" font-size="9.5">eth0 / en0 / Wi-Fi</text>
      <text x="70" y="60" text-anchor="middle" class="font-mono" fill="#94a3b8" font-size="8.5">Promiscuous Mode</text>
      <circle cx="30" cy="74" r="3.5" fill="#10b981" />
      <circle cx="50" cy="74" r="3.5" fill="#06b6d4" />
      <circle cx="70" cy="74" r="3.5" fill="#f59e0b" />
    </g>

    <!-- Kernel Ring Buffer -->
    <g transform="translate(20, 160)">
      <rect width="140" height="85" rx="6" fill="#182235" stroke="#3b82f6" stroke-width="1.2" />
      <text x="70" y="22" text-anchor="middle" class="font-sans" fill="#ffffff" font-size="10.5" font-weight="600">Kernel Ring Buffer</text>
      <text x="70" y="40" text-anchor="middle" class="font-mono" fill="#93c5fd" font-size="8.5">Linux: AF_PACKET</text>
      <text x="70" y="55" text-anchor="middle" class="font-mono" fill="#93c5fd" font-size="8.5">macOS: /dev/bpf*</text>
      <text x="70" y="70" text-anchor="middle" class="font-mono" fill="#93c5fd" font-size="8.5">Win: Npcap / WinPcap</text>
    </g>

    <!-- BPF Filter -->
    <g transform="translate(20, 260)">
      <rect width="140" height="90" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2" />
      <text x="70" y="24" text-anchor="middle" class="font-mono" fill="#c7d2fe" font-size="10" font-weight="700">BPF FILTER</text>
      <text x="70" y="44" text-anchor="middle" class="font-mono" fill="#a5b4fc" font-size="8.5">ip or ip6 or arp</text>
      <text x="70" y="60" text-anchor="middle" class="font-sans" fill="#e2e8f0" font-size="8.5">In-kernel bytecode</text>
      <text x="70" y="75" text-anchor="middle" class="font-mono" fill="#6ee7b7" font-size="8">Discards Noise</text>
    </g>
  </g>

  <!-- STAGE 2: PROTOCOL DECAPSULATION -->
  <g transform="translate(250, 95)">
    <rect width="210" height="370" rx="10" fill="#0d172a" stroke="#334155" stroke-width="1.3" />
    <rect x="15" y="15" width="180" height="24" rx="4" fill="#064e3b" />
    <text x="105" y="31" text-anchor="middle" class="font-mono" fill="#a7f3d0" font-size="10" font-weight="700">2. DECAPSULATION</text>

    <!-- OSI Layers Unpacking -->
    <!-- L2 Ethernet -->
    <g transform="translate(20, 55)">
      <rect width="170" height="50" rx="5" fill="#182235" stroke="#10b981" stroke-width="1.2" />
      <text x="15" y="22" class="font-mono" fill="#34d399" font-size="9.5" font-weight="700">LAYER 2: ETHERNET</text>
      <text x="15" y="38" class="font-mono" fill="#94a3b8" font-size="8.5">Src MAC · Dst MAC · Type</text>
    </g>

    <!-- L3 Network -->
    <g transform="translate(20, 115)">
      <rect width="170" height="55" rx="5" fill="#182235" stroke="#06b6d4" stroke-width="1.2" />
      <text x="15" y="20" class="font-mono" fill="#38bdf8" font-size="9.5" font-weight="700">LAYER 3: IPv4 / IPv6</text>
      <text x="15" y="35" class="font-mono" fill="#94a3b8" font-size="8.5">Src IP · Dst IP · TTL</text>
      <text x="15" y="48" class="font-mono" fill="#94a3b8" font-size="8">Proto: 6 (TCP), 17 (UDP)</text>
    </g>

    <!-- L4 Transport -->
    <g transform="translate(20, 180)">
      <rect width="170" height="58" rx="5" fill="#182235" stroke="#f59e0b" stroke-width="1.2" />
      <text x="15" y="20" class="font-mono" fill="#fbbf24" font-size="9.5" font-weight="700">LAYER 4: TCP / UDP</text>
      <text x="15" y="35" class="font-mono" fill="#94a3b8" font-size="8.5">Src Port · Dst Port · Seq/Ack</text>
      <text x="15" y="48" class="font-mono" fill="#fde047" font-size="8">Flags: SYN, ACK, FIN, RST</text>
    </g>

    <!-- L7 Application -->
    <g transform="translate(20, 250)">
      <rect width="170" height="95" rx="5" fill="#182235" stroke="#c084fc" stroke-width="1.2" />
      <text x="15" y="20" class="font-mono" fill="#d8b4fe" font-size="9.5" font-weight="700">LAYER 7: PAYLOAD INSPECTION</text>
      <text x="15" y="36" class="font-sans" fill="#e2e8f0" font-size="8.5">• HTTP: Host, Method, URI</text>
      <text x="15" y="52" class="font-sans" fill="#e2e8f0" font-size="8.5">• DNS: QName, QueryType</text>
      <text x="15" y="68" class="font-sans" fill="#e2e8f0" font-size="8.5">• TLS: SNI (Server Name)</text>
      <text x="15" y="84" class="font-mono" fill="#f43f5e" font-size="7.5">Zero Payload Decryption Leak</text>
    </g>
  </g>

  <!-- STAGE 3: FLOW SESSIONIZATION -->
  <g transform="translate(490, 95)">
    <rect width="210" height="370" rx="10" fill="#0d172a" stroke="#334155" stroke-width="1.3" />
    <rect x="15" y="15" width="180" height="24" rx="4" fill="#311042" />
    <text x="105" y="31" text-anchor="middle" class="font-mono" fill="#f5d0fe" font-size="10" font-weight="700">3. 5-TUPLE AGGREGATION</text>

    <!-- 5-Tuple Key Definition -->
    <g transform="translate(20, 55)">
      <rect width="170" height="85" rx="6" fill="#18181b" stroke="#e879f9" stroke-width="1.2" />
      <text x="15" y="20" class="font-mono" fill="#f0abfc" font-size="9.5" font-weight="700">SESSION HASH KEY</text>
      <text x="15" y="36" class="font-mono" fill="#94a3b8" font-size="8.5">Key = hash(src, dst,</text>
      <text x="15" y="48" class="font-mono" fill="#94a3b8" font-size="8.5">           sport, dport, proto)</text>
      <text x="15" y="64" class="font-mono" fill="#38bdf8" font-size="8">Bidirectional Pairing</text>
      <text x="15" y="76" class="font-mono" fill="#a7f3d0" font-size="8">Forward + Reverse Flow</text>
    </g>

    <!-- Sliding Window Aggregator -->
    <g transform="translate(20, 150)">
      <rect width="170" height="100" rx="6" fill="#111c30" stroke="#06b6d4" />
      <text x="15" y="20" class="font-mono" fill="#67e8f9" font-size="9.5" font-weight="700">SLIDING WINDOW ENGINE</text>
      <text x="15" y="36" class="font-sans" fill="#e2e8f0" font-size="8.5">• Window Size: 10 seconds</text>
      <text x="15" y="50" class="font-sans" fill="#e2e8f0" font-size="8.5">• Window Stride: 5 seconds</text>
      <text x="15" y="64" class="font-sans" fill="#e2e8f0" font-size="8.5">• Max Buffer: 5 windows</text>
      <text x="15" y="80" class="font-mono" fill="#fde047" font-size="8">Calculates Delta Flow Rates</text>
      <text x="15" y="92" class="font-mono" fill="#94a3b8" font-size="7.5">Bytes/sec, Pkts/sec</text>
    </g>

    <!-- Inactivity Timeout Eviction -->
    <g transform="translate(20, 260)">
      <rect width="170" height="85" rx="6" fill="#18181b" stroke="#64748b" />
      <text x="15" y="20" class="font-mono" fill="#94a3b8" font-size="9" font-weight="700">FLOW EVICTION POLICY</text>
      <text x="15" y="36" class="font-sans" fill="#e2e8f0" font-size="8">• TCP FIN/RST: Immediate flush</text>
      <text x="15" y="50" class="font-sans" fill="#e2e8f0" font-size="8">• Inactive Timeout: 60s</text>
      <text x="15" y="66" class="font-sans" fill="#e2e8f0" font-size="8">• Flushed to SQLite / ML Tensor</text>
    </g>
  </g>

  <!-- STAGE 4: DISPATCH & CORRELATION -->
  <g transform="translate(730, 95)">
    <rect width="190" height="370" rx="10" fill="#0d172a" stroke="#334155" stroke-width="1.3" />
    <rect x="15" y="15" width="160" height="24" rx="4" fill="#172554" />
    <text x="95" y="31" text-anchor="middle" class="font-mono" fill="#93c5fd" font-size="10" font-weight="700">4. DISPATCH CORE</text>

    <!-- Dispatch 1: Live Sockets -->
    <g transform="translate(15, 55)">
      <rect width="160" height="65" rx="6" fill="#111827" stroke="#10b981" />
      <text x="80" y="20" text-anchor="middle" class="font-mono" fill="#6ee7b7" font-size="9.5" font-weight="700">SOCKET STREAM</text>
      <text x="80" y="36" text-anchor="middle" class="font-sans" fill="#ffffff" font-size="8.5">Correlates with Agent PID</text>
      <text x="80" y="52" text-anchor="middle" class="font-mono" fill="#34d399" font-size="8">GET /api/live/stream</text>
    </g>

    <!-- Dispatch 2: ML 27-Feature Extractor -->
    <g transform="translate(15, 130)">
      <rect width="160" height="65" rx="6" fill="#111827" stroke="#8b5cf6" />
      <text x="80" y="20" text-anchor="middle" class="font-mono" fill="#c4b5fd" font-size="9.5" font-weight="700">ML INFERENCE TENSOR</text>
      <text x="80" y="36" text-anchor="middle" class="font-sans" fill="#ffffff" font-size="8.5">27 Canonical Vector</text>
      <text x="80" y="52" text-anchor="middle" class="font-mono" fill="#a78bfa" font-size="8">Shape: [1, 5, 27]</text>
    </g>

    <!-- Dispatch 3: Attack Graph Update -->
    <g transform="translate(15, 205)">
      <rect width="160" height="65" rx="6" fill="#111827" stroke="#ef4444" />
      <text x="80" y="20" text-anchor="middle" class="font-mono" fill="#fca5a5" font-size="9.5" font-weight="700">ATTACK GRAPH</text>
      <text x="80" y="36" text-anchor="middle" class="font-sans" fill="#ffffff" font-size="8.5">Dynamic Edge Injection</text>
      <text x="80" y="52" text-anchor="middle" class="font-mono" fill="#f87171" font-size="8">Active Lateral Link</text>
    </g>

    <!-- Zero Allocation Badge -->
    <g transform="translate(15, 290)">
      <rect width="160" height="55" rx="6" fill="#0f172a" stroke="#06b6d4" />
      <text x="80" y="22" text-anchor="middle" class="font-mono" fill="#38bdf8" font-size="9" font-weight="700">THROUGHPUT</text>
      <text x="80" y="40" text-anchor="middle" class="font-mono" fill="#10b981" font-size="8.5">&gt; 50,000 pkts/sec</text>
    </g>
  </g>

  <!-- Connective Arrows Between Columns -->
  <path d="M 220 280 L 250 280" stroke="#06b6d4" stroke-width="2" class="pf-stream" marker-end="url(#pf-arrow-cyan)" />
  <path d="M 460 280 L 490 280" stroke="#06b6d4" stroke-width="2" class="pf-stream" marker-end="url(#pf-arrow-cyan)" />
  <path d="M 700 280 L 730 280" stroke="#10b981" stroke-width="2" class="pf-stream-fast" marker-end="url(#pf-arrow-emerald)" />

  <!-- Bottom Legend -->
  <g transform="translate(60, 485)">
    <circle cx="10" cy="10" r="5" fill="#3b82f6" />
    <text x="25" y="14" class="font-mono" fill="#94a3b8" font-size="9.5">Kernel Ingestion Layer</text>

    <circle cx="230" cy="10" r="5" fill="#10b981" />
    <text x="245" y="14" class="font-mono" fill="#94a3b8" font-size="9.5">Decapsulation Engine</text>

    <circle cx="470" cy="10" r="5" fill="#e879f9" />
    <text x="485" y="14" class="font-mono" fill="#94a3b8" font-size="9.5">5-Tuple Aggregator</text>

    <circle cx="710" cy="10" r="5" fill="#06b6d4" />
    <text x="725" y="14" class="font-mono" fill="#94a3b8" font-size="9.5">Real-time Dispatch</text>
  </g>
</svg>
