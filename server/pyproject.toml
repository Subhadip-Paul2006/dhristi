[project]
name = "drishti-server"
version = "0.1.0"
description = "Drishti — AI-powered defensive cybersecurity platform"
requires-python = ">=3.11"

[dependencies]
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
pydantic = {extras = ["email"], version = "^2.9.0"}
pydantic-settings = "^2.5.0"
pyjwt = "^2.9.0"
bcrypt = "^4.1.0"
python-multipart = "^0.0.9"
httpx = "^0.27.0"
python-whois = "^0.8.0"
networkx = "^3.3"
numpy = "^2.1.0"
scikit-learn = "^1.5.0"
aiofiles = "^24.1.0"

[dev-dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.23.0"
ruff = "^0.6.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
